        function log(type, message) {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = message;
            document.getElementById('progress').appendChild(p);
            document.getElementById('progress').scrollTop = document.getElementById('progress').scrollHeight;
        }
        
        async function importarDatos() {
            const btn = document.getElementById('importBtn');
            btn.disabled = true;
            btn.textContent = 'Importando...';
            
            document.getElementById('progress').innerHTML = '';
            log('info', '🚀 Iniciando importación...');
            
            try {
                // TEMPERATURAS
                log('info', '\n📊 Importando temperaturas...');
                const { data: tempData, error: tempError } = await supabase
                    .from('temperaturas')
                    .insert(datos.temperaturas);
                
                if (tempError) {
                    log('error', '❌ Error en temperaturas: ' + tempError.message);
                } else {
                    log('success', '✅ ' + datos.temperaturas.length + ' temperaturas importadas');
                }
                
                // RECEPCIONES
                log('info', '\n📦 Importando recepciones...');
                const { data: recData, error: recError } = await supabase
                    .from('recepcion')
                    .insert(datos.recepcion);
                
                if (recError) {
                    log('error', '❌ Error en recepciones: ' + recError.message);
                } else {
                    log('success', '✅ ' + datos.recepcion.length + ' recepciones importadas');
                }
                
                // LIMPIEZAS
                log('info', '\n🧹 Importando limpiezas...');
                const { data: limpData, error: limpError } = await supabase
                    .from('limpieza')
                    .insert(datos.limpieza);
                
                if (limpError) {
                    log('error', '❌ Error en limpiezas: ' + limpError.message);
                } else {
                    log('success', '✅ ' + datos.limpieza.length + ' limpiezas importadas');
                }
                
                // PROVEEDORES
                log('info', '\n🏢 Importando proveedores...');
                const { data: provData, error: provError } = await supabase
                    .from('proveedores')
                    .insert(datos.proveedores);
                
                if (provError) {
                    log('error', '❌ Error en proveedores: ' + provError.message);
                } else {
                    log('success', '✅ ' + datos.proveedores.length + ' proveedores importados');
                }
                
                log('success', '\n\n🎉 ¡IMPORTACIÓN COMPLETADA!');
                log('info', 'Puedes cerrar esta página y abrir la app.');
                btn.textContent = '✅ IMPORTACIÓN COMPLETADA';
                
            } catch (error) {
                log('error', '❌ Error general: ' + error.message);
                btn.disabled = false;
                btn.textContent = 'Reintentar Importación';
            }
        }
