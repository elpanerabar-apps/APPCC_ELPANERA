<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #d97642 0%, #f4ece6 100%);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { 
            color: #d97642; 
            margin-bottom: 30px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #d97642;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #c66535;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🧪 Test Login Simple</h1>
        
        <form id="testForm">
            <input type="text" id="user" placeholder="Usuario" value="david">
            <input type="password" id="pass" placeholder="Contraseña" value="panera2026">
            <button type="submit">PROBAR LOGIN</button>
        </form>
        
        <div id="result" class="result"></div>
        
        <div style="margin-top: 30px; padding: 15px; background: #f9f9f9; border-radius: 4px; font-size: 14px;">
            <strong>Credenciales válidas:</strong><br>
            • david / panera2026<br>
            • lili / panera2026<br>
            • admin / admin2026
        </div>
    </div>

    <script>
        console.log('🚀 Script cargado');
        
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('📝 Formulario enviado');
            
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            
            console.log('Usuario:', user);
            console.log('Contraseña:', pass);
            
            const validUsers = {
                'david': 'panera2026',
                'lili': 'panera2026',
                'admin': 'admin2026'
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            if (validUsers[user] === pass) {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = '✅ <strong>LOGIN CORRECTO!</strong><br>Usuario: ' + user;
                console.log('✅ Login exitoso');
                
                // Probar Supabase
                setTimeout(() => {
                    resultDiv.innerHTML += '<br><br>Cargando librería Supabase...';
                    const script = document.createElement('script');
                    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                    script.onload = () => {
                        resultDiv.innerHTML += '<br>✅ Librería Supabase cargada';
                        console.log('✅ Supabase library loaded');
                        
                        try {
                            const supabase = window.supabase.createClient(
                                'https://qjwngtsicucyeskhlucz.supabase.co',
                                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqd25ndHNpY3VjeWVza2hsdWN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMjMyNTIsImV4cCI6MjA5Mzg5OTI1Mn0.CBpP4GBezSUL51Qp_Hc0fqJSm6jQaOrgkFAWj3g9qCg'
                            );
                            resultDiv.innerHTML += '<br>✅ Cliente Supabase creado';
                            console.log('✅ Supabase client created');
                            
                            resultDiv.innerHTML += '<br><br><strong>TODO FUNCIONA CORRECTAMENTE! 🎉</strong>';
                        } catch (err) {
                            resultDiv.innerHTML += '<br>❌ Error creando cliente: ' + err.message;
                            console.error('Error:', err);
                        }
                    };
                    script.onerror = () => {
                        resultDiv.innerHTML += '<br>❌ Error cargando Supabase';
                        console.error('Error loading Supabase');
                    };
                    document.head.appendChild(script);
                }, 1000);
                
            } else {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ <strong>CREDENCIALES INCORRECTAS</strong><br>Verifica usuario y contraseña';
                console.log('❌ Login fallido');
            }
        });
        
        console.log('✅ Event listener registrado');
    </script>
</body>
</html>
